<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070f11">
  <title>{% block title %}Quorum — Evidence-Backed Investment Research{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand logomark" href="/">
        <svg width="26" height="26" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="14" cy="14" r="12" stroke="#4caf7d" stroke-width="1.4"/>
          <circle cx="14" cy="14" r="8.5" stroke="#4caf7d" stroke-width="1" opacity="0.4"/>
          <path d="M9.5 14l3 3 6-6.5" stroke="#d9a13d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span>Quorum</span>
      </a>
      <nav class="topnav" aria-label="Primary">
        <a href="/#example">Validation</a>
        <a href="/#differentiation">Product</a>
        <a href="/#how-it-works">How it works</a>
      </nav>
      <a class="btn btn-filled btn-sm" href="/register" data-track="hero_cta_click">Get early access &rarr;</a>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <span class="brand-mark logomark">
        <svg width="20" height="20" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="14" cy="14" r="12" stroke="#4caf7d" stroke-width="1.4"/>
          <circle cx="14" cy="14" r="8.5" stroke="#4caf7d" stroke-width="1" opacity="0.4"/>
          <path d="M9.5 14l3 3 6-6.5" stroke="#d9a13d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        Quorum
      </span>
      <p>Quorum is a research-assistance tool, not financial advice. Outputs are not a recommendation to buy, hold, or sell any security.</p>
    </div>
  </footer>
  <script src="/static/track.js"></script>
  <script src="/static/reveal.js"></script>
</body>
</html>
